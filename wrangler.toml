name = "missmatch"
# SvelteKit の Worker を包んで scheduled を足した入口（src/worker.ts を見よ）
main = "src/worker.ts"
alias = { "kit-worker" = "./.svelte-kit/cloudflare/_worker.js" }
compatibility_date = "2025-10-01"
compatibility_flags = ["nodejs_compat"]

[assets]
binding = "ASSETS"
directory = ".svelte-kit/cloudflare"

# AI バインディングはローカル開発でもリモートを叩く（課金対象）
[ai]
binding = "AI"
remote = true

# 雰囲気プロファイルとサーバー一覧のキャッシュ
# `wrangler kv namespace create VIBE_KV` で作成した id に差し替える
[[kv_namespaces]]
binding = "VIBE_KV"
id = "be9cfe4fae00490ca3fc2bb6a38e2a2b"

# トップページの例文の判定を温める。1 日 1 回（12:00 JST）、判定キャッシュは 7 日で切れるので、切れた分だけ判定する。
# 温めと欠け埋めは Workers AI の無料枠（1 日 10,000 Neurons）を使い切ったら翌日に回す（src/lib/server/budget.ts）。
# 以前は 25 時間で捨てて毎日 16 言葉 × 13 本を置き直していて、それだけで無料枠の 1.8 倍だった
[triggers]
crons = ["0 3 * * *"]

[observability]
enabled = true
